<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Holly Haunt</title>
  <style>
    :root { --gold:#e8c36a; --ink:#140a0c; --cream:#fff3dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #140a0c; color: var(--cream); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    body {
      display: flex; flex-direction: column;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 8px 12px 6px;
    }
    header b { color: var(--gold); letter-spacing: .14em; font-size: 11px; }
    #sub { font-size: 13px; opacity: .85; }
    #score { font-weight: 800; font-size: 18px; }
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #070405;
      touch-action: none;
    }
    #pic {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .ring {
      position: absolute; border-radius: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      border: 3px solid #3ecf8e;
      box-shadow: 0 0 12px #3ecf8e99;
    }
    .ring.hint {
      border: 3px dashed #e8c36a;
      box-shadow: 0 0 16px #e8c36a;
      animation: pulse .8s ease-in-out 4;
    }
    @keyframes pulse { 50% { transform: translate(-50%,-50%) scale(1.15); } }
    #toast {
      position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
      background: #000c; padding: 8px 14px; border-radius: 999px;
      font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
      white-space: nowrap;
    }
    .pop {
      position: absolute; transform: translate(-50%, -80%);
      font: 800 22px "Trebuchet MS", sans-serif; color: #fff6d8;
      text-shadow: 0 2px 10px #000; pointer-events: none; z-index: 4;
      animation: floaty .9s ease-out forwards;
    }
    @keyframes floaty { to { transform: translate(-50%, -160%); opacity: 0; } }
    #list {
      display: flex; gap: 6px; overflow-x: auto;
      padding: 7px 10px; background: #1c1010;
    }
    .chip {
      flex: 0 0 auto; border: 0; border-radius: 999px;
      padding: 7px 10px; background: #fff2; color: var(--cream); font-size: 12px;
    }
    .chip.got { text-decoration: line-through; opacity: .4; }
    #bar {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 8px 10px 10px; background: #1c1010;
    }
    #bar button {
      height: 48px; border: 0; border-radius: 14px;
      font: 800 16px "Trebuchet MS", sans-serif;
    }
    #roomsBtn { background: #3a241c; color: var(--cream); }
    #hintBtn { background: var(--gold); color: #1a1208; }
    #pick {
      position: fixed; inset: 0; background: #140a0cee;
      display: none; flex-direction: column; justify-content: flex-end;
      padding: 18px; z-index: 5;
    }
    #pick.on { display: flex; }
    h1 { font-size: 32px; line-height: .95; margin: 6px 0 12px; }
    .rooms { display: grid; gap: 8px; }
    .room.lock { filter: grayscale(.55) brightness(.7); }
    .room .tag { display:block; font-size:11px; letter-spacing:.12em; color:#e8c36a; margin-top:4px; }
    #pay {
      position: fixed; inset: 0; background: #140a0cf2;
      display: none; flex-direction: column; justify-content: flex-end;
      padding: 18px; z-index: 6;
    }
    #pay.on { display: flex; }
    #pay button { height: 48px; border: 0; border-radius: 14px; font: 800 16px "Trebuchet MS", sans-serif; margin-top: 8px; }
    #payGo { background: var(--gold); color: #1a1208; }
    #payNo { background: #3a241c; color: var(--cream); }
  </style>
</head>
<body>
  <header>
    <div>
      <b id="roomName">GREAT HALL</b>
      <div id="sub">Tap the objects in the picture</div>
    </div>
    <div id="score">0/12</div>
  </header>
  <div id="stage">
    <img id="pic" alt="room" />
    <div id="toast">Tap the picture</div>
  </div>
  <div id="list"></div>
  <div id="bar">
    <button id="roomsBtn" type="button">Rooms</button>
    <button id="hintBtn" type="button">Hint</button>
  </div>
  <div id="pick">
    <p style="color:#e8c36a;letter-spacing:.16em;font-size:11px">HOLLY HAUNT</p>
    <h1>Pick a room</h1>
    <div class="rooms" id="rooms"></div>
  </div>
  <div id="pay">
    <p style="color:#e8c36a;letter-spacing:.16em;font-size:11px">LOCKED</p>
    <h1>Unlock the other rooms</h1>
    <p id="payLine" style="margin-bottom:12px;opacity:.9">Kitchen and Bedroom open after payment.</p>
    <button id="payGo" type="button">Pay to unlock</button>
    <button id="payNo" type="button">Not now</button>
  </div>
<script>
const UNLOCK_URL = "https://buy.stripe.com/test_hollyhaunt";
const paid = localStorage.getItem("hollyHaunt.paid") === "1" || /[?&]paid=1/.test(location.search);
const SCENES = [
  { id:"hall", name:"Great Hall", file:"hall.jpg", free:true, items:[
    {n:"Moon",x:50,y:11,s:10},
    {n:"Witch bear",x:16,y:50,s:14},
    {n:"Treasure chest",x:24,y:68,s:14},
    {n:"Music box",x:48,y:66,s:12},
    {n:"Nutcracker",x:68,y:58,s:12},
    {n:"Carnival mask",x:88,y:67,s:10},
    {n:"Wooden dog",x:11,y:78,s:12},
    {n:"Snow globe",x:76,y:74,s:10},
    {n:"Hourglass",x:90,y:81,s:9},
    {n:"Spectacles",x:38,y:88,s:10},
    {n:"Thimble",x:52,y:86,s:7},
    {n:"Golden key",x:64,y:89,s:11}
  ]},
  { id:"kitchen", name:"Kitchen", file:"kitchen.jpg", free:false, items:[
    {n:"Wall clock",x:50,y:12,s:10},
    {n:"Hanging lantern",x:68,y:14,s:9},
    {n:"Moon window",x:84,y:16,s:12},
    {n:"Kitchen tree",x:90,y:34,s:12},
    {n:"Cauldron",x:68,y:48,s:12},
    {n:"Big pumpkin",x:32,y:52,s:12},
    {n:"Red candle",x:22,y:58,s:8},
    {n:"Gingerbread",x:28,y:70,s:9},
    {n:"Candy cane",x:36,y:74,s:8},
    {n:"Rolling pin",x:48,y:68,s:11},
    {n:"Lattice pie",x:58,y:62,s:11},
    {n:"Black cat",x:82,y:78,s:13}
  ]},
  { id:"bedroom", name:"Bedroom", file:"bedroom.jpg", free:false, items:[
    {n:"Crescent moon",x:73,y:10,s:8},
    {n:"Window moon",x:90,y:14,s:10},
    {n:"Oval mirror",x:8,y:24,s:12},
    {n:"Jewelry box",x:13,y:38,s:12},
    {n:"Grandfather clock",x:68,y:30,s:10},
    {n:"Corner tree",x:88,y:36,s:12},
    {n:"Night pumpkin",x:90,y:50,s:10},
    {n:"Witch bear",x:18,y:58,s:14},
    {n:"Toy train",x:22,y:76,s:14},
    {n:"Spectacles",x:48,y:84,s:10},
    {n:"Hourglass",x:68,y:78,s:10},
    {n:"Gift tower",x:90,y:72,s:12}
  ]}
];

const stage = document.getElementById("stage");
const pic = document.getElementById("pic");
const list = document.getElementById("list");
const toast = document.getElementById("toast");
const pick = document.getElementById("pick");
let scene = SCENES[0];
let found = new Set();
let hints = 3;
let actx = null;
let findN = 0;

function audio(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, t, dur, type, vol){
  const c = audio();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.97), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function tick(t){
  const c = audio();
  const n = Math.floor(c.sampleRate * 0.045);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource();
  s.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "highpass";
  f.frequency.value = 1800;
  const g = c.createGain();
  g.gain.setValueAtTime(0.09, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  s.connect(f); f.connect(g); g.connect(c.destination);
  s.start(t);
}
function bell(freq, t){
  tone(freq, t, 0.22, "sine", 0.11);
  tone(freq * 2.02, t, 0.14, "triangle", 0.045);
  tick(t);
}
function jingle(){
  const t = audio().currentTime + 0.02;
  const E = 659.25, G = 783.99, C = 523.25, D = 587.33;
  bell(E, t);
  bell(E, t + 0.16);
  bell(E, t + 0.32);
  bell(G, t + 0.52);
  bell(C, t + 0.68);
  bell(D, t + 0.84);
  bell(E, t + 1.04);
}
function hoho(){
  const c = audio();
  const t0 = c.currentTime + 0.02;
  [0, 0.32, 0.64].forEach((dt, i) => {
    const t = t0 + dt;
    const o = c.createOscillator();
    const g = c.createGain();
    const bp = c.createBiquadFilter();
    o.type = "sawtooth";
    const f = 130 + i * 28;
    o.frequency.setValueAtTime(f * 0.85, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.45, t + 0.1);
    o.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.24);
    bp.type = "bandpass";
    bp.frequency.value = 650 + i * 80;
    bp.Q.value = 5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(bp); bp.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.26);
    const len = Math.floor(c.sampleRate * 0.2);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let k = 0; k < len; k++) data[k] = (Math.random() * 2 - 1) * Math.sin(Math.PI * k / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const ng = c.createGain();
    ng.gain.value = 0.05;
    const hf = c.createBiquadFilter();
    hf.type = "bandpass";
    hf.frequency.value = 1400;
    src.connect(hf); hf.connect(ng); ng.connect(c.destination);
    src.start(t);
  });
}
function miss(){
  tone(140, audio().currentTime + 0.01, 0.09, "sawtooth", 0.05);
}
function safe(fn){ try { fn(); } catch (e) {} }
function celebrate(){
  findN++;
  if (findN % 2 === 0) hoho();
  else jingle();
}
function popAt(clientX, clientY, text){
  const sr = stage.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "pop";
  el.textContent = text;
  el.style.left = (clientX - sr.left) + "px";
  el.style.top = (clientY - sr.top) + "px";
  stage.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
function say(t){
  toast.textContent = t;
  toast.classList.add("on");
  clearTimeout(say.tid);
  say.tid = setTimeout(() => toast.classList.remove("on"), 1300);
}

function imageBox(){
  const r = stage.getBoundingClientRect();
  const nw = pic.naturalWidth || 2, nh = pic.naturalHeight || 3;
  const sr = r.width / Math.max(1, r.height);
  const ir = nw / nh;
  let w, h, left, top;
  if (sr > ir) {
    h = r.height; w = h * ir;
    left = r.left + (r.width - w) / 2; top = r.top;
  } else {
    w = r.width; h = w / ir;
    left = r.left; top = r.top + (r.height - h) / 2;
  }
  return { left, top, w, h };
}

function pctToScreen(x, y){
  const b = imageBox();
  return { x: b.left + b.w * x / 100, y: b.top + b.h * y / 100, w: b.w, h: b.h };
}

function clearRings(){
  stage.querySelectorAll(".ring").forEach(n => n.remove());
}
function placeRing(it, cls){
  const p = pctToScreen(it.x, it.y);
  const b = imageBox();
  const el = document.createElement("div");
  el.className = "ring " + (cls || "");
  const size = Math.max(36, (it.s || 10) / 100 * b.w);
  el.style.width = size + "px";
  el.style.height = size + "px";
  const sr = stage.getBoundingClientRect();
  el.style.left = (p.x - sr.left) + "px";
  el.style.top = (p.y - sr.top) + "px";
  stage.appendChild(el);
  return el;
}

function renderList(){
  list.innerHTML = "";
  scene.items.forEach((it, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (found.has(i) ? " got" : "");
    b.textContent = it.n;
    b.onclick = () => { say("Find the " + it.n); };
    list.appendChild(b);
  });
  document.getElementById("score").textContent = found.size + "/" + scene.items.length;
  document.getElementById("roomName").textContent = scene.name.toUpperCase();
}

function openScene(sc){
  if (!sc.free && !paid) {
    document.getElementById("payLine").textContent = sc.name + " opens after payment. Great Hall stays free.";
    document.getElementById("pay").classList.add("on");
    return;
  }
  scene = sc; found = new Set(); hints = 3;
  pic.src = sc.file;
  pick.classList.remove("on");
  document.getElementById("pay").classList.remove("on");
  renderList();
  say("Tap objects");
  safe(() => bell(523, audio().currentTime + 0.02));
}

function hit(clientX, clientY){
  const b = imageBox();
  const x = (clientX - b.left) / b.w * 100;
  const y = (clientY - b.top) / b.h * 100;
  if (x < -2 || y < -2 || x > 102 || y > 102) { say("Tap the picture"); return; }
  let best = -1, bestD = 1e9;
  scene.items.forEach((it, i) => {
    const dx = x - it.x;
    const dy = (y - it.y) * (b.h / b.w);
    const d = Math.hypot(dx, dy);
    const need = (it.s || 10) * 0.7;
    if (d < need && d < bestD) { bestD = d; best = i; }
  });
  if (best < 0) { say("Not that"); safe(miss); return; }
  if (found.has(best)) { say("Already found"); safe(() => bell(880, audio().currentTime + 0.01)); return; }
  found.add(best);
  const ho = findN % 2 === 1;
  safe(celebrate);
  popAt(clientX, clientY, ho ? "Ho ho ho!" : "Jingle!");
  say(scene.items[best].n);
  renderList();
  if (found.size === scene.items.length) {
    say("Room cleared");
    safe(() => setTimeout(jingle, 400));
    safe(() => setTimeout(hoho, 1600));
    setTimeout(() => pick.classList.add("on"), 2800);
  }
}

stage.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  hit(e.clientX, e.clientY);
});

document.getElementById("roomsBtn").onclick = () => pick.classList.add("on");
document.getElementById("hintBtn").onclick = () => {
  const i = scene.items.findIndex((_, k) => !found.has(k));
  if (i < 0 || hints <= 0) { say("No hints left"); return; }
  hints--;
  const el = placeRing(scene.items[i], "hint");
  setTimeout(() => el.remove(), 1800);
  say(scene.items[i].n + " · " + hints + " left");
  safe(() => bell(988, audio().currentTime + 0.02));
};

const roomsEl = document.getElementById("rooms");
SCENES.forEach((sc) => {
  const b = document.createElement("button");
  b.className = "room" + ((sc.free || paid) ? "" : " lock");
  b.style.backgroundImage = "url('" + sc.file + "')";
  b.innerHTML = sc.name + '<span class="tag">' + ((sc.free || paid) ? "FREE" : "LOCKED · PAY") + "</span>";
  b.onclick = () => openScene(sc);
  roomsEl.appendChild(b);
});
document.getElementById("payNo").onclick = () => document.getElementById("pay").classList.remove("on");
document.getElementById("payGo").onclick = () => window.open(UNLOCK_URL, "_blank", "noopener");
openScene(SCENES[0]);
</script>
</body>
</html>
